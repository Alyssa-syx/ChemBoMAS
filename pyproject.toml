[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chembomas"
version = "0.1.0"
description = "A multi-agent workflow for chemistry experiment validation, Bayesian optimization, and analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = [
    "bayesian-optimization",
    "chemistry",
    "multi-agent-system",
    "scientific-machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "baybe==0.13.2",
    "google-adk==1.12.0",
    "matplotlib==3.10.5",
    "mordred==1.2.0",
    "numpy==1.26.4",
    "pandas==2.3.2",
    "rdkit==2024.09.5",
    "scikit-fingerprints==1.18.0",
    "scikit-learn==1.7.1",
    "seaborn==0.13.2",
]

[project.urls]
Homepage = "https://github.com/Alyssa-syx/ChemBoMAS"
Repository = "https://github.com/Alyssa-syx/ChemBoMAS"
Issues = "https://github.com/Alyssa-syx/ChemBoMAS/issues"

[tool.setuptools.packages.find]
include = ["agent_zyf*"]
